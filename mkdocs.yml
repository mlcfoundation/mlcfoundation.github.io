site_name: MLC Foundation
site_url: https://www.mlcfoundation.org.in/
site_description: >-
  Mewalal Chaurasia Foundation is a non-profit voluntary research organisation
  in the field of population and development. We conduct research, organise
  seminars, publish monographs, and publish the Indian Journal of Population
  and Development (IJPD, ISSN 2583-4827).
site_author: Mewalal Chaurasia Foundation
copyright: Copyright &copy; 2020&ndash;2026 Mewalal Chaurasia Foundation. All rights reserved.

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: amber
      toggle:
        icon: material/toggle-switch
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: amber
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to light mode
  font:
    text: Inter
  logo: img/favicon.png
  favicon: img/favicon.ico

plugins:
  - search
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra:
  social:
    - icon: fontawesome/solid/envelope
      link: mailto:contact@mlcfoundation.org.in
      name: Email MLC Foundation
  generator: false

nav:
  - Home: index.md
  - Activities:
      - Studies: activities/studies.md
      - Seminars: activities/seminars.md
  - Research:
      - Publications: research/publications.md
      - NFHS: research/nfhs.md
      - FPPE: research/fppe.md
  - IJPD:
      - Indian Journal of Population and Development: ijpd/journal.md
      - Editorial Board: ijpd/editors.md
      - Editorial Policy: ijpd/policy.md
      - Submissions: ijpd/submission.md
      - Current Issue: ijpd/issues.md
      - Archives: ijpd/archives.md
      - Contact: ijpd/contact.md
  - About:
      - Trustees: about/trustees.md
      - Experts: about/experts.md
      - Facilities: about/facilities.md
      - Contact: about/contact.md
